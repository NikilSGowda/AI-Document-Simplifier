<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A simple foundation for understanding complex documents."
    />
    <title>AI Smart Document Simplifier</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">AI SMART DOCUMENT SIMPLIFIER</p>
        <h1 id="page-title">Understand complex information, clearly.</h1>
        <p class="description">
          This project foundation is ready. Document simplification will be
          added in later phases.
        </p>
      </section>

      <section class="status-card" aria-labelledby="connection-title">
        <div>
          <h2 id="connection-title">Backend connection</h2>
          <p id="connection-message" role="status" aria-live="polite">
            Checking the backend…
          </p>
        </div>
        <button id="check-connection" type="button">Check connection</button>
      </section>
    </main>
  </body>
</html>
